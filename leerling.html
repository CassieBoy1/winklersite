<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WP Hub | Leerling</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#070b14;color:#eef5ff}header{padding:18px 24px;background:#0b1220;border-bottom:1px solid #26344d;display:flex;justify-content:space-between}a{color:#9fc0ff;text-decoration:none}.wrap{max-width:1100px;margin:30px auto;padding:0 20px}.box{background:#101a2c;border:1px solid #26344d;border-radius:20px;padding:24px;margin-bottom:18px}input{width:100%;padding:13px;margin:7px 0 12px;border-radius:10px;border:1px solid #34435d;background:#080e19;color:white}button{padding:12px 17px;border:0;border-radius:10px;background:#467cff;color:#fff;font-weight:800;cursor:pointer}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tab{background:#18243a}.hidden{display:none}.chat{height:330px;overflow:auto;background:#080e19;border-radius:14px;padding:15px}.msg{padding:10px 13px;margin:7px 0;border-radius:12px;background:#17243a}.mine{margin-left:20%;background:#315fc2}.row{display:flex;gap:9px}.row input{flex:1}.event{padding:13px;background:#17243a;border-radius:12px;margin:9px 0}.muted{color:#8da0b9;font-size:13px}.notice{padding:12px;background:#17243a;border-radius:10px;margin-top:12px}@media(max-width:600px){.row{display:block}.mine{margin-left:0}}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><header><b>🎓 WP HUB • LEERLING</b><a href="index.html">← Hub</a></header><main class="wrap"><section id="auth" class="box"><h1>Leerlingaccount</h1><p class="muted">Echt online account via Supabase.</p><label>E-mail</label><input id="email" type="email" placeholder="jij@example.com"><label>Wachtwoord</label><input id="pw" type="password" placeholder="Minimaal 6 tekens"><label>Naam</label><input id="name" placeholder="Bijv. Sam"><div class="row"><button onclick="signup()">ACCOUNT MAKEN</button><button onclick="login()">INLOGGEN</button></div><div id="authmsg" class="notice"></div></section><section id="app" class="hidden"><div class="box"><h1>Hoi <span id="who"></span> 👋</h1><div class="tabs"><button class="tab" onclick="show('chat')">💬 Leerling chat</button><button class="tab" onclick="show('agenda')">📅 Agenda</button><button class="tab" onclick="show('profile')">👤 Mijn account</button><button class="tab" onclick="logout()">Uitloggen</button></div></div><section id="chat" class="box"><h2>💬 Leerling chat</h2><div class="chat" id="messages"></div><div class="row"><input id="chatin" placeholder="Typ een bericht..." onkeydown="if(event.key==='Enter')send()"><button onclick="send()">Verstuur</button></div></section><section id="agenda" class="box hidden"><h2>📅 Agenda</h2><div id="events"><div class="muted">Agenda laden...</div></div></section><section id="profile" class="box hidden"><h2>👤 Mijn account</h2><p>Account: <b id="profileName"></b></p><p class="muted">Je wachtwoord wordt nooit opgeslagen in deze pagina.</p></section><div class="notice">🔒 Geen wachtwoorden zichtbaar voor beheerders en geen verborgen schermbewaking.</div></section></main><script>const SUPABASE_URL='https://rwovlgfwhanbfopwblqj.supabase.co';const SUPABASE_KEY='VUL_HIER_JOUW_SUPABASE_PUBLISHABLE_KEY_IN';let sb=null,currentUser=null;const $=id=>document.getElementById(id);function msg(t){$('authmsg').textContent=t}function ready(){if(SUPABASE_KEY.startsWith('VUL_')){msg('Supabase-sleutel ontbreekt. Vul de publishable key in bij SUPABASE_KEY.');return false}if(!sb)sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return true}async function signup(){if(!ready())return;const email=$('email').value.trim(),password=$('pw').value,name=$('name').value.trim();if(!email||!password||!name)return msg('Vul e-mail, naam en wachtwoord in.');if(password.length<6)return msg('Wachtwoord moet minimaal 6 tekens zijn.');const {data,error}=await sb.auth.signUp({email,password,options:{data:{display_name:name}}});if(error)return msg(error.message);if(data.user)await sb.from('profiles').upsert({id:data.user.id,display_name:name,role:'student'});msg('Account aangemaakt. Controleer eventueel je e-mail en log daarna in.')}async function login(){if(!ready())return;const {data,error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('pw').value});if(error)return msg(error.message);openApp(data.user)}async function openApp(user){currentUser=user;let {data:p}=await sb.from('profiles').select('*').eq('id',user.id).maybeSingle();if(!p){const n=user.user_metadata?.display_name||user.email.split('@')[0];await sb.from('profiles').insert({id:user.id,display_name:n,role:'student'});p={display_name:n}}$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('who').textContent=p.display_name;$('profileName').textContent=p.display_name;await loadMessages();await loadEvents();subscribe()}async function logout(){await sb.auth.signOut();location.reload()}function show(id){['chat','agenda','profile'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}async function loadMessages(){const {data,error}=await sb.from('messages').select('id,body,created_at,sender_id,profiles(display_name)').order('created_at',{ascending:true}).limit(200);if(error)return $('messages').innerHTML='<div class="muted">Chat kon niet laden.</div>';$('messages').innerHTML=(data||[]).map(m=>'<div class="msg '+(m.sender_id===currentUser.id?'mine':'')+'"><b>'+escapeHtml(m.profiles?.display_name||'Leerling')+'</b><br>'+escapeHtml(m.body)+'</div>').join('');$('messages').scrollTop=$('messages').scrollHeight}async function send(){const input=$('chatin'),body=input.value.trim();if(!body||!currentUser)return;const {error}=await sb.from('messages').insert({sender_id:currentUser.id,body});if(error)return alert(error.message);input.value=''}async function loadEvents(){const {data}=await sb.from('events').select('*').order('start_at',{ascending:true}).limit(100);$('events').innerHTML=data?.length?data.map(e=>'<div class="event"><b>'+escapeHtml(e.title)+'</b><br><span class="muted">'+new Date(e.start_at).toLocaleString('nl-NL')+'</span>'+(e.description?'<br>'+escapeHtml(e.description):'')+'</div>').join(''):'<div class="muted">Nog geen agenda-items.</div>'}function subscribe(){sb.channel('chat').on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},loadMessages).subscribe();sb.channel('events').on('postgres_changes',{event:'*',schema:'public',table:'events'},loadEvents).subscribe()}function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</script></body></html>
