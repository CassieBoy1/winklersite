<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>WP AI — zonder API key</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#070b14;color:#eef5ff;font-family:Inter,Arial,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,rgba(31,105,255,.2),transparent 30%),radial-gradient(circle at 85% 80%,rgba(128,66,255,.18),transparent 30%);z-index:-1}.wrap{width:min(900px,100%);height:min(760px,calc(100vh - 36px));display:flex;flex-direction:column;background:rgba(10,16,28,.9);border:1px solid rgba(255,255,255,.1);border-radius:24px;overflow:hidden;box-shadow:0 30px 90px rgba(0,0,0,.45);backdrop-filter:blur(18px)}header{padding:18px 22px;border-bottom:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:12px;font-weight:900}.logo{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,#6d5cff,#2f7cff);font-size:22px;box-shadow:0 0 25px rgba(95,92,255,.3)}.status{font-size:11px;color:#65e6a8}.back{color:#a9b9d1;text-decoration:none;font-size:12px;font-weight:800}.chat{flex:1;overflow:auto;padding:24px}.msg{max-width:78%;padding:13px 16px;margin:10px 0;border-radius:17px;white-space:pre-wrap;line-height:1.55;font-size:14px}.bot{background:#141e32;border-bottom-left-radius:5px}.user{margin-left:auto;background:linear-gradient(135deg,#327cff,#684cff);border-bottom-right-radius:5px}.typing{opacity:.55}.suggestions{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 12px}.suggestions button{border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.05);color:#cbd8eb;border-radius:999px;padding:8px 12px;cursor:pointer}.form{display:flex;gap:9px;padding:15px 18px;border-top:1px solid rgba(255,255,255,.08);background:rgba(5,9,17,.65)}input{flex:1;min-width:0;background:#080e19;color:white;border:1px solid rgba(255,255,255,.1);outline:none;border-radius:14px;padding:14px 15px;font-size:14px}input:focus{border-color:#568cff}button.send{border:0;border-radius:14px;padding:0 20px;background:linear-gradient(135deg,#327cff,#684cff);color:#fff;font-weight:900;cursor:pointer}@media(max-width:600px){.wrap{height:calc(100vh - 20px);border-radius:18px}.msg{max-width:88%}.back{display:none}}
</style>
</head>
<body><div class="wrap"><header><div class="brand"><div class="logo">🤖</div><div>WP AI<div class="status">● ONLINE • ZONDER API KEY</div></div></div><a class="back" href="index.html">← TERUG NAAR HUB</a></header><div class="chat" id="chat"><div class="msg bot">Hoi! 👋 Ik ben WP AI. Ik draai lokaal in je browser, dus er is geen API-key nodig. Stel me iets over school, rekenen, tijd, uitleg of gewoon een vraag.</div></div><div class="suggestions"><button onclick="ask('Leg breuken simpel uit')">Breuken uitleggen</button><button onclick="ask('Wat is 12 x 8?')">Rekenen</button><button onclick="ask('Hoe laat is het?')">Tijd</button><button onclick="ask('Help me met leren')">Leertip</button></div><form class="form" onsubmit="send(event)"><input id="input" autocomplete="off" placeholder="Bericht sturen naar WP AI..."><button class="send" type="submit">Stuur →</button></form></div>
<script>
const chat=document.getElementById('chat'),input=document.getElementById('input');
function add(text,who='bot'){const d=document.createElement('div');d.className='msg '+who;d.textContent=text;chat.appendChild(d);chat.scrollTop=chat.scrollHeight}
function ask(t){input.value=t;input.focus();send()}
function calc(s){try{if(!/^[0-9+\-*/().%\s]+$/.test(s))return null;let x=Function('"use strict";return ('+s+')')();return Number.isFinite(x)?String(x):null}catch{return null}}
function reply(q){let s=q.toLowerCase().trim();if(!s)return 'Typ maar iets 😄';let c=calc(s.replace(/wat is|bereken|uitrekenen/g,''));if(c!==null)return 'Het antwoord is '+c+'.';if(/^(hoi|hallo|hey|heyy|yo)\b/.test(s))return 'Hoi! 😄 Waar kan ik je mee helpen?';if(s.includes('hoe laat')||s.includes('tijd'))return 'Het is nu '+new Date().toLocaleTimeString('nl-NL',{hour:'2-digit',minute:'2-digit'})+'.';if(s.includes('welke dag')||s.includes('datum'))return 'Vandaag is '+new Date().toLocaleDateString('nl-NL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})+'.';if(s.includes('breuk'))return 'Een breuk laat een deel van een geheel zien. Bij 3/4 is 3 de teller en 4 de noemer. Je hebt dus 3 van 4 gelijke delen.';if(s.includes('procent'))return 'Procent betekent “per honderd”. 25% = 25/100 = 0,25. Van €80 is 25% dus €20.';if(s.includes('vergelijking')||s.includes('vergelijkingen'))return 'Bij een simpele vergelijking probeer je de onbekende alleen te krijgen. Bijvoorbeeld x + 5 = 12 → trek 5 van beide kanten af → x = 7.';if(s.includes('leren')||s.includes('toets')||s.includes('huiswerk'))return 'Leertip: werk 25 minuten geconcentreerd, neem 5 minuten pauze en test jezelf daarna zonder je boek te bekijken. Dat werkt vaak beter dan alleen herlezen.';if(s.includes('html'))return 'HTML is de structuur van een website. Bijvoorbeeld: <h1>Mijn site</h1> maakt een grote kop.';if(s.includes('css'))return 'CSS bepaalt hoe je website eruitziet: kleuren, ruimte, lettertypes, animaties en layout.';if(s.includes('javascript')||s.includes('js'))return 'JavaScript maakt een website interactief. Je kunt er bijvoorbeeld knoppen, chats, calculators en games mee bouwen.';if(s.includes('magister'))return 'Magister gebruik je voor schoolinformatie zoals je rooster, cijfers en berichten. Je kunt het openen via de WP Hub.';if(s.includes('game')||s.includes('spelen'))return '🎮 Tijd voor pauze? Open Games in de WP Hub en kies iets leuks.';if(s.includes('dank')||s.includes('thanks'))return 'Graag gedaan! 😎';if(s.includes('wie ben jij'))return 'Ik ben WP AI, een kleine browser-chatbot van je WP Hub. Ik heb geen API-key nodig.';if(s.includes('help'))return 'Zeker. Je kunt me bijvoorbeeld vragen om iets uit te leggen, een berekening te doen, een leertip te geven of te helpen met HTML/CSS/JavaScript.';return 'Ik kan dit lokaal proberen te beantwoorden, maar ik ben geen volledige ChatGPT zonder online AI-model. Probeer je vraag anders te formuleren of vraag me om iets uit te leggen, te rekenen of met school/code te helpen.'}
function send(e){if(e)e.preventDefault();let q=input.value.trim();if(!q)return;add(q,'user');input.value='';let t=document.createElement('div');t.className='msg bot typing';t.textContent='Even denken…';chat.appendChild(t);chat.scrollTop=chat.scrollHeight;setTimeout(()=>{t.remove();add(reply(q),'bot')},350)}
</script></body></html>
